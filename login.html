<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | VimShi Cooking</title>
  
  <link rel="icon" type="image/png" href="https://yt3.googleusercontent.com/dV_NHfyFB_A9rwbWwd-zGpNseeY-WozgBLVc4XZHpnxZnuKClarYzU-NGe5YVBESV15f6V-BfQ=s160-c-k-c0x00ffffff-no-rj" />
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-orange-500 selection:text-white relative overflow-hidden">

  <!-- Ambient Glow Behind Card -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-orange-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-rose-600/20 rounded-full blur-3xl pointer-events-none"></div>

  <div class="max-w-md w-full relative z-10">
    
    <!-- Header Logo & Title -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full p-1 bg-gradient-to-tr from-amber-400 to-rose-600 shadow-xl mb-4">
        <img src="https://yt3.googleusercontent.com/dV_NHfyFB_A9rwbWwd-zGpNseeY-WozgBLVc4XZHpnxZnuKClarYzU-NGe5YVBESV15f6V-BfQ=s160-c-k-c0x00ffffff-no-rj" 
             alt="VimShi Cooking Logo" class="w-full h-full object-cover rounded-full" />
      </div>
      <h1 class="font-serif font-black text-2xl sm:text-3xl tracking-tight text-white">VimShi Cooking</h1>
      <p class="text-xs font-semibold tracking-wider uppercase text-amber-400 mt-1">Admin Portal • Server-Side Protected</p>
    </div>

    <!-- Login Card -->
    <div class="bg-slate-800/90 backdrop-blur-xl border border-slate-700/80 rounded-3xl p-6 sm:p-8 shadow-2xl">
      
      <!-- Security Badge -->
      <div class="flex items-center justify-between text-xs text-slate-400 pb-4 mb-4 border-b border-slate-700/60">
        <span class="flex items-center gap-1.5 text-emerald-400 font-semibold">
          <i class="fa-solid fa-shield-halved"></i> 256-Bit Salted Hash
        </span>
        <span class="flex items-center gap-1 text-slate-400">
          <i class="fa-solid fa-lock"></i> HttpOnly Cookie
        </span>
      </div>

      <!-- Error / Flash Message Display -->
      {% if error %}
      <div class="mb-5 p-3.5 rounded-2xl bg-rose-950/60 border border-rose-500/50 text-rose-300 text-xs sm:text-sm flex items-start gap-2.5">
        <i class="fa-solid fa-triangle-exclamation text-rose-400 mt-0.5 shrink-0"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <!-- Login Form -->
      <form method="POST" action="/login" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">
            Admin Username
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
              <i class="fa-solid fa-user-shield text-xs"></i>
            </span>
            <input type="text" name="username" required autocomplete="username" autofocus
                   placeholder="Enter admin username"
                   class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1.5">
            Password
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
              <i class="fa-solid fa-key text-xs"></i>
            </span>
            <input type="password" id="passwordInput" name="password" required autocomplete="current-password"
                   placeholder="Enter your secure password"
                   class="w-full pl-10 pr-11 py-3 rounded-xl bg-slate-900/80 border border-slate-700 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all" />
            <button type="button" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility"
                    class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-white transition-colors">
              <i id="eyeIcon" class="fa-solid fa-eye-slash text-xs"></i>
            </button>
          </div>
        </div>

        <button type="submit"
                class="w-full py-3.5 mt-2 bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-700 hover:to-amber-700 text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg shadow-orange-600/30 transition-all active:scale-95 flex items-center justify-center gap-2">
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
          <span>Authenticate & Access Dashboard</span>
        </button>
      </form>

      <!-- Security Notice -->
      <div class="mt-6 pt-4 border-t border-slate-700/60 text-center">
        <p class="text-[11px] text-slate-400 leading-relaxed">
          <i class="fa-solid fa-shield-virus text-amber-500 mr-1"></i>
          Protected by IP rate limiting (5 attempts / 15m) & encrypted session tokens.
        </p>
        <a href="/" class="inline-flex items-center gap-1.5 text-xs text-orange-400 hover:text-orange-300 font-semibold mt-3 transition-colors">
          <i class="fa-solid fa-arrow-left text-[10px]"></i> Back to Public Website
        </a>
      </div>
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const input = document.getElementById('passwordInput');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye text-xs text-orange-400';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye-slash text-xs text-slate-400';
      }
    }
  </script>
</body>
</html>
